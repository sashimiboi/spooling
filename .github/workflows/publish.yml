name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # trigger on v0.2.0, v1.0.0, etc.

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spooling/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (no token needed)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC Trusted Publishing — no PYPI_API_TOKEN secret needed.
        # One-time setup on pypi.org:
        #   Your projects → spooling → Publishing → Add a publisher
        #   Owner: sashimiboi  Repo: spooling  Workflow: publish.yml  Env: pypi
